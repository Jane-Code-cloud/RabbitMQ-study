logging:
  pattern:
    dateformat: MM-dd HH:mm:ss:SSS
spring:
  rabbitmq:
    host: 192.168.100.102
    port: 5672
    virtual-host: /rabbitmq-learn
    password: 123456
    username: rabitmq-learn
    connection-timeout: 1s #设置MQ的超时时间
    template:
      retry:
        enabled: true #开启超时重试机制
        initial-interval: 1000ms #失败后的初始等待时间
        multiplier: 1 #失败后的下次等待时长倍数，下次等待时长=initial-interval * multiplier
        max-attempts: 3 #最大重试次数
    publisher-confirm-type: correlated
    publisher-returns: true


